<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="corpo">
     <button id="clique-em-mim" onclick="mostrarNoConsole()">Clique em mim</button>
</body>

<script>
    function mostrarNoConsole(event) {
        console.log(event);
        console.count ("fui clicado");
        const corpo = document.getElementById("corpo");
        corpo.style.backgroundColor = "#b3ebf2";
    }
    const botao = document.querySelector("#clique-em-mim");
    botao.addEventListener("click", mostrarNoConsole);
</script>
</html>
