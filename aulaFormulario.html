<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Formulário</title>
    <style>
      .mensagemErro {
        color: red;
        font-size: 0.85rem;
        display: block;
        margin-top: 4px;
      }
      div {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body id="corpo">
    <button id="clique-em-mim">Clique em mim</button>

    <section>
      <form id="meuFormulario">
        <div>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" />
          <span id="erroNome" class="mensagemErro"></span>
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input type="text" id="email" name="email" />
          <span id="erroEmail" class="mensagemErro"></span>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </section>

    <script>
      // --- 1. LÓGICA DO BOTÃO DE COR DE FUNDO ---
      function mostrarNoConsole(event) {
        console.log(event);
        console.count("fui clicado");
        const corpo = document.getElementById("corpo");
        corpo.style.backgroundColor = "#b3ebf2";
      }

      const botao = document.querySelector("#clique-em-mim");
      botao.addEventListener("click", mostrarNoConsole);

      // --- 2. LÓGICA DE VALIDAÇÃO DO FORMULÁRIO ---
      const formulario = document.getElementById("meuFormulario");

      formulario.addEventListener("submit", function (event) {
        // Interceptação: Impede o recarregamento automático da página
        event.preventDefault();

        // Captura dos valores digitados
        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();

        // Referência para os elementos de mensagem de erro
        const spanErroNome = document.getElementById("erroNome");
        const spanErroEmail = document.getElementById("erroEmail");

        // Limpa mensagens de erro anteriores
        spanErroNome.textContent = "";
        spanErroEmail.textContent = "";

        let formularioValido = true;

        // Validação do campo Nome
        if (nome === "") {
          spanErroNome.textContent = "Por favor, preencha o nome.";
          formularioValido = false;
        }

        // Validação do campo E-mail
        if (email === "" || !email.includes("@")) {
          spanErroEmail.textContent =
            'Por favor, insira um e-mail válido com "@".';
          formularioValido = false;
        }

        // Resultado
        if (formularioValido) {
          alert("Dados válidos! Formulário enviado com sucesso.");
          formulario.reset(); // Limpa os campos do formulário apenas se for válido
        }
      });
    </script>
  </body>
</html>
