<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
</head>
<body id="corpo">
    <button id="clique-em-mim" onclick="mostrarNoConsole()">Clique em mim</button>
    <section>
    <form id="meuFormulario">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <span id="erroNome" class="mensagemErro"></span>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email">
            <span id="erroEmail" class="mensagemErro"></span>
        </div>

        <button type="submit">Enviar</button>
    </form>
    
</body>
<script>
    function mostrarNoConsole(event) {
        console.log(event);
        console.count ("fui clicado");
        const corpo = document.getElementById("corpo");
        corpo.style.backgroundColor = "#b3ebf2";
    }
    const botao = document.querySelector("#clique-em-mim");
    botao.addEventListener("click", mostrarNoConsole);
</script>
</html>
